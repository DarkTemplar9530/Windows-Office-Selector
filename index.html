        :root {
            --bg-color: #f9f9f9;
            --text-color: #333;
            --h1-color: #0078d4;
            --link-color: #0078d4;
            --item-bg: white;
            --item-border: #ccc;
            --item-shadow: rgba(0,0,0,0.05);
            --item-shadow-hover: rgba(0,0,0,0.1);
            --path-color: #777;
            --btn-copy-bg: #555;
            --btn-copy-hover: #333;
            --btn-primary-bg: #0078d4;
            --btn-primary-hover: #005a9e;
            --btn-green-bg: #107c41;
            --btn-green-hover: #0b5a2f;
            --hint-color: #777;
            --input-border: #ccc;
            --input-bg: white;
            --desc-bg: #e9f6ff;
            --desc-border: #0078d4;
            --usb-desc-border: #eee;
            --usb-desc-color: #555;
            --fav-active: #f3a621; 
            --fav-inactive: #ccc;
            --fav-hover: #e09410;
        }

        body.dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --h1-color: #4db2ff;
            --link-color: #4db2ff;
            --item-bg: #2d2d2d;
            --item-border: #444;
            --item-shadow: rgba(0,0,0,0.2);
            --item-shadow-hover: rgba(0,0,0,0.4);
            --path-color: #aaa;
            --btn-copy-bg: #444;
            --btn-copy-hover: #666;
            --btn-green-bg: #1a9653;
            --btn-green-hover: #147a41;
            --hint-color: #aaa;
            --input-border: #444;
            --input-bg: #2d2d2d;
            --desc-bg: #2a2a2a;
            --desc-border: #0078d4;
            --usb-desc-border: #444;
            --usb-desc-color: #bbb;
            --fav-active: #F4B23D;
            --fav-inactive: #555;
            --fav-hover: #ffd075;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            text-align: center;
            color: var(--h1-color);
            transition: color 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #main > div, select, .desc, .search-result-item {
            animation: fadeIn 0.3s ease-out;
        }

        .search-result-item {
            margin: 12px 0;
            padding: 15px;
            border: 1px solid var(--item-border);
            border-radius: 8px;
            background-color: var(--item-bg);
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 4px var(--item-shadow);
        }
        
        .search-result-item:hover {
            box-shadow: 0 4px 8px var(--item-shadow-hover);
        }

        .search-result-item.transparent-card {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 10px 0;
            margin: 0;
        }
        
        .search-result-path {
            font-size: 13px;
            color: var(--path-color);
            margin-bottom: 8px;
            line-height: 1.4;
            transition: color 0.3s;
        }
        
        .search-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-result-title {
            font-weight: bold;
            font-size: 16px;
            flex: 1 1 0%;
            min-width: 200px;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
        .action-buttons-container {
            display: flex; 
            gap: 10px; 
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-left: auto;
        }

        .search-result-btn {
            padding: 8px 16px;
            background-color: var(--btn-primary-bg);
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s;
            white-space: nowrap;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: inline-block;
            text-align: center;
        }
        .search-result-btn:hover {
            background-color: var(--btn-primary-hover);
        }
        .btn-copy {
            background-color: var(--btn-copy-bg);
        }
        .btn-copy:hover {
            background-color: var(--btn-copy-hover);
        }
        .btn-green {
            background-color: var(--btn-green-bg);
        }
        .btn-green:hover {
            background-color: var(--btn-green-hover);
        }

        @media (max-width: 600px) {
            .search-result-header {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .search-result-title {
                text-align: center;
                margin-bottom: 0;
            }
            .action-buttons-container {
                flex-direction: column; 
                width: 100%;
                margin-left: 0;
                gap: 10px; 
            }
            .favorite-btn {
                margin: 0 auto; 
                width: auto;
                transform: scale(1.2); 
            }
            .favorite-btn:hover {
                transform: scale(1.4);
            }
            .search-result-btn {
                width: 100%; 
                box-sizing: border-box;
                padding: 14px; 
                font-size: 15px;
            }
        }

        .hint-text {
            text-align: center;
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 15px;
            font-style: italic;
            transition: color 0.3s;
        }

        #search-container {
            margin-bottom: 20px;
            position: relative;
            width: 100%;
        }
        
        #search-input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.3s, background-color 0.3s, color 0.3s;
        }
        #search-input:focus {
            border-color: var(--btn-primary-bg);
            outline: none;
        }
        
        #search-input::-webkit-search-cancel-button {
            -webkit-appearance: none;
            appearance: none;
            height: 14px;
            width: 14px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23777'><path d='M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'/></svg>");
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 12px;
            padding-right: 36px;
            margin: 10px 0;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.3s, background-color 0.3s, color 0.3s;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='gray' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }
        select:focus {
            border-color: var(--btn-primary-bg);
            outline: none;
        }
        
        .desc {
            margin: 10px 0;
            padding: 15px;
            background-color: var(--desc-bg);
            border-left: 4px solid var(--desc-border);
            border-radius: 4px;
            font-size: 16px;
            display: none;
            line-height: 1.5;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .desc a {
            color: var(--link-color);
            text-decoration: underline;
            transition: color 0.3s;
        }
        
        .usb-desc-text {
            margin-top: 12px; 
            font-size: 14px; 
            color: var(--usb-desc-color); 
            line-height: 1.5;
            border-top: 1px solid var(--usb-desc-border);
            padding-top: 12px;
            transition: color 0.3s, border-color 0.3s;
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--btn-primary-bg);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", NotoColorEmoji, sans-serif;
        }
        #theme-toggle:hover {
            background-color: var(--btn-primary-hover);
            transform: scale(1.05);
        }
        
        #no-results {
            text-align: center;
            color: var(--hint-color);
            font-style: italic;
            margin-top: 20px;
            display: none;
        }

        #favorites-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 10px;
            display: none;
        }
        
        #favorites-header {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--fav-active);
            margin: 0;
        }

        #clear-favorites-btn {
            background: none;
            border: 1px solid var(--item-border);
            color: var(--hint-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        #clear-favorites-btn:hover {
            background: var(--item-border);
            color: var(--text-color);
        }

        .favorite-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--fav-inactive);
            transition: color 0.3s, transform 0.2s;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .favorite-btn:hover {
            transform: scale(1.2);
            color: var(--fav-hover);
        }

        .favorite-btn.active {
            color: var(--fav-active);
        }
    </style>
</head>

    <script>
        (function() {
            'use strict';
            try {
                var storedTheme = localStorage.getItem('theme');
                var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (storedTheme === 'dark' || (!storedTheme && systemDark)) {
                    document.body.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>

        </div>

    <main>
        <div id="favorites-header-container">
            <h2 id="favorites-header">⭐ Избранное</h2>
            <button id="clear-favorites-btn" title="Очистить весь список избранного">Очистить всё</button>
        </div>
        <div id="favorites-container" aria-live="polite"></div>
        <hr style="border: 0; border-top: 1px solid var(--item-border); margin: 20px 0; opacity: 0.5;" id="favorites-divider" hidden>

        <div id="main"></div>
        <div id="search-results-container" aria-live="polite" role="status"></div>
        <div id="no-results" aria-live="polite">Ничего не найдено</div>
    </main>

        function escapeAttr(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function safeUrl(url) {
            if (url && /^https?:\/\//i.test(url)) {
                return url;
            }
            return '#'; 
        }

        function createSafeHighlightedHTML(text, tokens) {
            const validTokens = tokens.filter(t => t.length > 0 && t.trim() !== '');
            if (!validTokens.length) return escapeAttr(text);
            
            validTokens.sort((a, b) => b.length - a.length);
            const pattern = validTokens.map(escapeRegExp).join('|');
            const regex = new RegExp(`(${pattern})`, 'gi');
            
            const parts = text.split(regex);
            return parts.map((part, index) => {
                if (index % 2 === 1) { 
                    return '<b>' + escapeAttr(part) + '</b>';
                }
                return escapeAttr(part);
            }).join('');
        }

        function setSafeHTML(element, htmlString) {
            element.innerHTML = ''; 
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            
            function sanitizeAndAppend(source, target) {
                source.childNodes.forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        target.appendChild(document.createTextNode(node.nodeValue));
                    } else if (node.nodeType === Node.ELEMENT_NODE) {
                        const tagName = node.tagName.toLowerCase();
                        if (['b', 'strong', 'br', 'span', 'i', 'p'].includes(tagName)) {
                            const newEl = document.createElement(tagName);
                            sanitizeAndAppend(node, newEl);
                            target.appendChild(newEl);
                        } else if (tagName === 'a') {
                            const newEl = document.createElement('a');
                            const href = node.getAttribute('href');
                            if (href && /^https?:\/\//i.test(href)) {
                                newEl.setAttribute('href', href);
                                newEl.setAttribute('target', '_blank');
                                newEl.setAttribute('rel', 'noopener noreferrer');
                            }
                            sanitizeAndAppend(node, newEl);
                            target.appendChild(newEl);
                        }
                    }
                });
            }
            
            sanitizeAndAppend(doc.body, element);
        }

            const card = document.createElement('div');
            card.className = 'search-result-item' + (hideTitle ? ' transparent-card' : '');
            if (!hideTitle) card.style.marginTop = '20px';
            
            const header = document.createElement('div');
            header.className = 'search-result-header';
            
            if (!hideTitle) {
                const titleSpan = document.createElement('span');
                titleSpan.className = 'search-result-title';
                titleSpan.textContent = title;
                header.appendChild(titleSpan);
            }
            
            const pathStr = path.join(' ➔ ');
            const actions = createActionButtons(title, url, pathStr);
            if (hideTitle) {
                actions.style.margin = '0 auto';
                actions.style.width = '100%';
                actions.style.justifyContent = 'center';
            }
            
            header.appendChild(actions);
            card.appendChild(header);
            return card;
        }

        let searchTimeout;

        searchInput.addEventListener('input', function(e) {
            const rawQuery = e.target.value.toLowerCase().trim();
            
            if (!rawQuery) {
                clearTimeout(searchTimeout);
                searchResultsContainer.innerHTML = '';
                noResults.style.display = 'none';
                main.style.display = 'block';
                searchResultsContainer.style.display = 'none';
                return;
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchResultsContainer.innerHTML = '';
                noResults.style.display = 'none';
                main.style.display = 'none';
                searchResultsContainer.style.display = 'block';

                const tokens = rawQuery.split(/\s+/).map(token => {
                    return searchAliases[token] || token;
                });

                const tokenRegexes = tokens.map(token => {
                    return new RegExp('(^|[\\s\\[\\]\\(\\)\\-_,])' + escapeRegExp(token), 'i');
                });

                const results = flatData.filter(item => {
                    return tokenRegexes.every(regex => regex.test(item.searchText));
                });

                if (results.length > 0) {
                    const fragment = document.createDocumentFragment();
                    
                    results.forEach(res => {
                        const item = document.createElement('div');
                        item.className = 'search-result-item';
                        
                        const breadcrumbs = res.path.slice(0, -1).join(' ➔ ');
                        const fileName = res.path[res.path.length - 1];

                        const pathDiv = document.createElement('div');
                        pathDiv.className = 'search-result-path';
                        pathDiv.innerHTML = createSafeHighlightedHTML(breadcrumbs, tokens);
                        item.appendChild(pathDiv);

                        const header = document.createElement('div');
                        header.className = 'search-result-header';

                        const titleSpan = document.createElement('span');
                        titleSpan.className = 'search-result-title';
                        titleSpan.innerHTML = createSafeHighlightedHTML(fileName, tokens);
                        header.appendChild(titleSpan);

                        const actions = createActionButtons(fileName, res.url, breadcrumbs);
                        header.appendChild(actions);
                        item.appendChild(header);

                        fragment.appendChild(item);
                    });
                    searchResultsContainer.appendChild(fragment);
                } else {
                    noResults.style.display = 'block';
                }
            }, 250);
        });

        function appendUsbSuggestion(container, path) {
            if (path[0] !== 'Windows') return;

            let toolUrl = '';
            let toolName = '';

            const fullPath = path.join(' ');

            if (fullPath.includes('Windows XP')) {
                toolUrl = 'https://disk.yandex.ru/d/XLyO70kcB3hXGw';
                toolName = 'Запись образа на USB-накопитель';
            } else if (fullPath.includes('Windows 7')) {
                toolUrl = 'https://disk.yandex.ru/d/AMAtqtojBumDoA';
                toolName = 'Запись образа на USB-накопитель';
            } else if (
                fullPath.includes('Windows 8') || 
                fullPath.includes('Windows 10') || 
                fullPath.includes('Windows 11')
            ) {
                toolUrl = 'https://disk.yandex.ru/d/z97KEl-7laHO5Q';
                toolName = 'Запись образа на USB-накопитель';

            if (toolUrl) {
                const card = document.createElement('div');
                card.className = 'search-result-item';
                card.style.marginTop = '15px';
                card.style.borderLeft = '4px solid var(--btn-green-bg)';
                
                const header = document.createElement('div');
                header.className = 'search-result-header';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'search-result-title';
                titleSpan.style.display = 'flex';
                titleSpan.style.alignItems = 'center';
                titleSpan.style.justifyContent = 'flex-start';
                titleSpan.style.gap = '8px';
                titleSpan.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 15C8.55 15 9 15.45 9 16C9 16.55 8.55 17 8 17C7.45 17 7 16.55 7 16C7 15.45 7.45 15 8 15M15.07 4.69L16.5 6.1L15.07 7.5L13.66 6.1L15.07 4.69M17.9 7.5L19.31 8.93L17.9 10.34L16.5 8.93L17.9 7.5M8 13C6.34 13 5 14.34 5 16C5 17.66 6.34 19 8 19C9.66 19 11 17.66 11 16C11 14.34 9.66 13 8 13M9.77 4.33L10.5 5.08L14.29 1.29C14.47 1.11 14.72 1 15 1C15.28 1 15.53 1.11 15.71 1.29L22.78 8.36L22.78 8.37C22.92 8.54 23 8.76 23 9C23 9.3 22.87 9.57 22.66 9.76L22.66 9.76L18.93 13.5L19.67 14.23L12.95 20.95C11.68 22.22 9.93 23 8 23C4.13 23 1 19.87 1 16C1 14.07 1.78 12.32 3.05 11.05L9.77 4.33M20.59 9L15 3.41L11.93 6.5L17.5 12.08L20.59 9Z" /></svg>`;
                titleSpan.appendChild(document.createTextNode(toolName));

                const actions = document.createElement('div');
                actions.className = 'action-buttons-container';

                const linkBtn = document.createElement('a');
                linkBtn.className = 'search-result-btn btn-green';
                linkBtn.href = safeUrl(toolUrl);
                linkBtn.target = '_blank';
                linkBtn.rel = 'noopener noreferrer';

        function buildNext(container, currentObj, path, isRoot = false) {
            if (!currentObj) return;

            if (typeof currentObj === 'string') {
                const title = path.length > 0 ? path[path.length - 1] : "Перейти по ссылке";
                container.appendChild(createDownloadCard(title, currentObj, true, path));
                appendUsbSuggestion(container, [...path, title]);
                return;
            }

            const keys = Object.keys(currentObj);
            if (keys.length === 0) return;
            
            const isEndNode = keys.every(k => typeof currentObj[k] === 'string');

            if (isEndNode) {
                if (keys.length === 1) {
                    const fileName = keys[0];
                    const url = currentObj[fileName];
                    
                    container.appendChild(createDownloadCard(fileName, url, false, path));
                    appendUsbSuggestion(container, [...path, fileName]);
                    return;
                }

                const select = document.createElement('select');
                select.setAttribute('aria-label', "Выберите файл");
                
                const defOpt = document.createElement('option');
                defOpt.value = "";
                defOpt.textContent = "Выберите файл";
                select.appendChild(defOpt);

                keys.forEach(k => {
                    const opt = document.createElement('option');
                    opt.value = k;
                    opt.textContent = k;
                    select.appendChild(opt);
                });

                container.appendChild(select);
                
                const resultContainer = document.createElement('div');
                container.appendChild(resultContainer);
                
                select.addEventListener('change', function() {
                    const val = this.value;
                    resultContainer.innerHTML = '';
                    if (val) {
                        const url = currentObj[val];
                        resultContainer.appendChild(createDownloadCard(val, url, true, [...path, val]));
                        appendUsbSuggestion(resultContainer, [...path, val]);
                    }
                });
                return;
            }
            
            const wrapper = document.createElement('div');
            const select = document.createElement('select');
            
            let defaultOptionText = isRoot ? "Выберите, что хотите скачать или сделать" : "Выберите";
            select.setAttribute('aria-label', defaultOptionText);
            
            const defOpt = document.createElement('option');
            defOpt.value = "";
            defOpt.textContent = defaultOptionText;
            select.appendChild(defOpt);

            keys.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                select.appendChild(opt);
            });
            
            wrapper.appendChild(select);

            const isBitness = keys.some(k => k.includes('-bit') || k === 'ARM64');
            const isEdition = keys.some(k => k.includes('Consumer Edition') || k.includes('Business Edition'));
            
            const staticDescDiv = document.createElement('div');
            staticDescDiv.className = 'desc';
            
            if (path.length > 0 && path[0] === 'Windows') {
                if (isBitness) {
                    staticDescDiv.textContent = bitnessDesc;
                    staticDescDiv.style.display = 'block';
                } else if (isEdition) {
                    staticDescDiv.textContent = editionDesc;
                    staticDescDiv.style.display = 'block';
                }
            }
            wrapper.appendChild(staticDescDiv);
            
            const selectionDescDiv = document.createElement('div');
            selectionDescDiv.className = 'desc';
            wrapper.appendChild(selectionDescDiv);

            const nextLevelContainer = document.createElement('div');
            wrapper.appendChild(nextLevelContainer);

            container.appendChild(wrapper);
            
            select.addEventListener('change', function() {
                const val = this.value;
                
                nextLevelContainer.innerHTML = '';
                selectionDescDiv.style.display = 'none';
                selectionDescDiv.innerHTML = ''; 

                if (val) {
                    let matchedDesc = null;
                    for (const key in sourceDescs) {
                        if (val.includes(key)) {
                            matchedDesc = sourceDescs[key];
                            break;
                        }
                    }

                    if (matchedDesc) {
                        setSafeHTML(selectionDescDiv, matchedDesc); 
                        selectionDescDiv.style.display = 'block';
                    }
                    
                    buildNext(nextLevelContainer, currentObj[val], [...path, val]);
                }
            });
        }
        
        function copyToClipboardFallback(text, onSuccess, onError) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(tryExecCommand);
            } else {
                tryExecCommand();
            }

            function tryExecCommand() {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        onSuccess();
                    } else {
                        showPromptFallback();
                    }
                } catch (err) {
                    showPromptFallback();
                } finally {
                    document.body.removeChild(textArea);
                }
            }

            function showPromptFallback() {
                if (text.startsWith('http')) {
                    prompt("Ваш браузер заблокировал автоматическое копирование. Скопируйте ссылку вручную:", text);
                } else {
                    alert("Ошибка: Невозможно скопировать текст.");
                    onError();
                }
            }
        }

        document.addEventListener('click', function(e) {
            const favBtn = e.target.closest('[data-action="favorite"]');
            if (favBtn) {
                const title = favBtn.getAttribute('data-title');
                const url = favBtn.getAttribute('data-url');
                const path = favBtn.getAttribute('data-path');
                toggleFavorite(title, url, path);
                return;
            }

            const copyBtn = e.target.closest('[data-action="copy"]');
            if (copyBtn) {
                const url = copyBtn.getAttribute('data-url');
                
                copyToClipboardFallback(url, 
                    () => {
                        copyBtn.innerText = 'Скопировано!';
                        if (copyBtn.copyTimeout) clearTimeout(copyBtn.copyTimeout);
                        copyBtn.copyTimeout = setTimeout(() => {
                            copyBtn.innerText = 'Скопировать ссылку';
                        }, 2000);
                    }, 
                    () => {
                        copyBtn.innerText = 'Ошибка';
                        if (copyBtn.copyTimeout) clearTimeout(copyBtn.copyTimeout);
                        copyBtn.copyTimeout = setTimeout(() => {
                            copyBtn.innerText = 'Скопировать ссылку';
                        }, 2000);
                    }
                );
                return;
            }
        });

        const toggleButton = document.getElementById('theme-toggle');

        function updateThemeIcon() {
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('icon-sun').style.display = isDark ? 'block' : 'none';
            document.getElementById('icon-moon').style.display = isDark ? 'none' : 'block';
        }

        updateThemeIcon();

        toggleButton.onclick = function() {
            document.body.classList.toggle('dark-mode');
            try {
                localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            } catch (e) {
                console.warn("Не удалось сохранить тему в localStorage", e);
            }
            updateThemeIcon();
        };
